[project]
name = "vocab-repetition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
    "customtkinter>=5.2.2",
    "torch>=2.12.0",
    "matplotlib>=3.10.9",
    "optuna>=4.8.0",
    "sentence-transformers>=5.5.1",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: trains a real (tiny) model end to end; deselect with -m 'not slow'",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
explicit_package_bases = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["customtkinter.*"]
ignore_missing_imports = true
